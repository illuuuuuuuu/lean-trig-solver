[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-trig-solver"
version = "0.1.0"
description = "A Lean-verified AI solver specialized in trigonometry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Illusix Liu" }]
dependencies = []

[project.scripts]
lean-trig-solver = "lean_trig_solver.cli:main"

[tool.setuptools.packages.find]
include = ["lean_trig_solver*"]

